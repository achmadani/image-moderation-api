# Staging. Same image as production, different env file and port, so both can
# run side by side on this host.
#
#   docker compose -f docker-compose.staging.yml up -d
# Distinct project name: both files otherwise derive it from the directory,
# and `up` on one would tear down the other's container as a stale resource.
name: nsfwjs:-staging

services:
  nsfwjs:
    image: nsfwjs:${IMAGE_TAG:-latest}
    container_name: nsfwjs:-staging
    restart: unless-stopped

    env_file:
      - .env.staging

    # Loopback only: nginx on the host terminates TLS and proxies to this port.
    # Without the 127.0.0.1 prefix Docker would publish it on every interface
    # and punch straight through the host firewall.
    ports:
      - "127.0.0.1:3001:3000"

    # Measured: ~290MB idle, and 12 concurrent 49-megapixel uploads add only
    # ~90MB on top — libvips decodes in tiles rather than materialising the
    # whole bitmap, so sharp is not the memory hazard it looks like. 1GB leaves
    # roughly 2.5x headroom over the observed peak.
    mem_limit: 1024m
    # Equal to mem_limit: with swap allowed the container would thrash the SSD
    # instead of failing fast when a leak appears.
    memswap_limit: 1024m
    cpus: 2.0

    # The service writes nothing to disk (rule #8: only the hash is kept), so
    # the filesystem can stay read-only. sharp and libtensorflow only need /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # Gives server.js time to drain (/ready -> 503), finish in-flight work and
    # terminate the workers before Docker escalates to SIGKILL.
    stop_grace_period: 30s
